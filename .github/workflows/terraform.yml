name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write


jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: github.ref != 'refs/heads/main'

    defaults:
      run:
        working-directory: ./env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "bc37cea6-09a3-4cee-8945-890f5b2dcfc5"
          tenant-id: "ff7b0485-25c7-4264-b00f-fd1c4c1f0f08"
          subscription-id: "784dcbe8-46d9-4a47-be0e-70450bcf37c4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan